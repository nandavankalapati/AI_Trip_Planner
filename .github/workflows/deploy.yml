name: Deploy AI Trip Planner to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ai_trip
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ai_trip
          IMAGE_TAG: latest
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            # 1. Install dependencies on EC2 if missing
            which aws || (sudo apt-get update && sudo apt-get install -y awscli)
            which jq || (sudo apt-get update && sudo apt-get install -y jq)

            # 2. Log in to ECR
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            # 3. Pull latest secrets directly from AWS Secrets Manager into an env file
            aws secretsmanager get-secret-value \
              --secret-id ai-trip/production \
              --region $AWS_REGION \
              --query SecretString \
              --output text > /tmp/ai-trip-secret.json

            jq -r 'to_entries[] | "\(.key)=\(.value)"' /tmp/ai-trip-secret.json > /tmp/ai-trip.env
            chmod 600 /tmp/ai-trip.env /tmp/ai-trip-secret.json

            # 4. Pull latest Docker container image
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            # 5. Stop existing container
            docker stop ai-trip || true
            docker rm ai-trip || true

            # 6. Launch new container with environment file attached
            docker run -d \
              --name ai-trip \
              --restart unless-stopped \
              --env-file /tmp/ai-trip.env \
              -p 8000:8000 \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            # 7. Clean up raw JSON file and unused Docker images
            rm -f /tmp/ai-trip-secret.json
            docker image prune -f